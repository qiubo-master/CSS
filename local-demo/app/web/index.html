<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>轮胎智能客服 Demo</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #17202a; }
    main { max-width: 820px; margin: 24px auto; background: white; border-radius: 16px; box-shadow: 0 8px 30px #0002; overflow: hidden; }
    header { padding: 18px 22px; background: #163a5f; color: white; }
    header h1 { font-size: 20px; margin: 0 0 4px; }
    header small { opacity: .82; }
    #messages { min-height: 420px; max-height: 62vh; overflow-y: auto; padding: 20px; }
    .msg { max-width: 78%; padding: 12px 14px; border-radius: 14px; margin: 10px 0; white-space: pre-wrap; }
    .user { margin-left: auto; background: #d9ebff; }
    .bot { background: #edf0f2; }
    .meta, .citations { font-size: 12px; color: #667; margin-top: 8px; }
    .quick { padding: 0 16px 12px; display: flex; gap: 6px; flex-wrap: wrap; }
    button { padding: 10px 18px; border: 0; border-radius: 10px; background: #1769aa; color: white; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    .quick button { font-size: 12px; background: #50728f; }
    form { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 16px; border-top: 1px solid #ddd; align-items: center; }
    input[type="text"] { min-width: 0; padding: 12px; border: 1px solid #aaa; border-radius: 10px; font-size: 15px; }
    #file { display: none; }
    .attach { display: inline-flex; align-items: center; justify-content: center; padding: 10px 13px; border: 1px solid #9aa; border-radius: 10px; cursor: pointer; background: #f8fafc; }
    #attachments { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; }
    .preview { position: relative; width: 92px; padding: 6px; border: 1px solid #ccd4dc; border-radius: 10px; background: #fff; }
    .preview img { width: 92px; height: 72px; object-fit: cover; border-radius: 6px; display: block; }
    .preview span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; margin-top: 4px; }
    .preview button { position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; padding: 0; border-radius: 50%; background: #b42318; }
    .upload-note { grid-column: 1 / -1; color: #667; font-size: 12px; }
    @media (max-width: 620px) { main { margin: 0; border-radius: 0; min-height: 100vh; } form { grid-template-columns: auto 1fr; } #send { grid-column: 1 / -1; } }
  </style>
</head>
<body>
<main>
  <header><h1>轮胎智能客服 Demo</h1><small id="health">正在检查服务…</small></header>
  <div id="messages"><div class="msg bot">您好，我可以回答轮胎知识、车型适配、价格、活动和订单问题。现在也可以上传轮胎照片，为后续多模态识别做准备。</div></div>
  <div class="quick">
    <button data-q="225/55R17是什么意思？">规格解释</button>
    <button data-q="我的车换一套轮胎多少钱？">车型价格</button>
    <button data-q="我的订单预约到几点？">订单查询</button>
    <button data-q="轮胎鼓包了还能上高速吗？">安全风险</button>
  </div>
  <form id="form">
    <label class="attach" for="file" title="上传图片">＋ 图片</label>
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple>
    <input id="input" type="text" autocomplete="off" placeholder="输入问题，可同时上传轮胎图片">
    <button id="send">发送</button>
    <div id="attachments"></div>
    <div class="upload-note">支持 JPG、PNG、WebP；每张不超过 10MB，单次最多 4 张。</div>
  </form>
</main>
<script>
let conversationId;
const pendingImages = [];
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const fileInput = document.getElementById('file');
const attachments = document.getElementById('attachments');
const send = document.getElementById('send');
const quickButtons = [...document.querySelectorAll('[data-q]')];
function setReady(ready) { send.disabled=!ready; quickButtons.forEach(b=>b.disabled=!ready); fileInput.disabled=!ready; }
function newMessageId() { return globalThis.crypto?.randomUUID?.() || `msg_${Date.now()}_${Math.random().toString(36).slice(2)}`; }
function add(text, kind, meta='', images=[]) {
  const el=document.createElement('div'); el.className=`msg ${kind}`;
  images.forEach(image=>{ const img=document.createElement('img'); img.src=image.url; img.alt=image.filename; img.style='max-width:180px;max-height:150px;border-radius:8px;display:block;margin-bottom:8px'; el.appendChild(img); });
  const content=document.createElement('span'); content.textContent=text; el.appendChild(content);
  if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;el.appendChild(m);}
  messages.appendChild(el); messages.scrollTop=messages.scrollHeight; return {el,content};
}
function renderAttachments() {
  attachments.replaceChildren();
  pendingImages.forEach((image,index)=>{
    const card=document.createElement('div'); card.className='preview';
    const img=document.createElement('img'); img.src=image.preview; img.alt=image.file.name;
    const name=document.createElement('span'); name.textContent=image.file.name;
    const remove=document.createElement('button'); remove.type='button'; remove.textContent='×'; remove.title='移除';
    remove.onclick=()=>{URL.revokeObjectURL(image.preview);pendingImages.splice(index,1);renderAttachments();};
    card.append(img,name,remove); attachments.appendChild(card);
  });
}
fileInput.addEventListener('change',()=>{
  const files=[...fileInput.files]; fileInput.value='';
  for(const file of files){
    if(pendingImages.length>=4){alert('单次最多上传 4 张图片');break;}
    if(file.size>10*1024*1024){alert(`${file.name} 超过 10MB`);continue;}
    pendingImages.push({file,preview:URL.createObjectURL(file)});
  }
  renderAttachments();
});
async function openConversation(){const r=await fetch('/api/v1/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:'u_001'})});if(!r.ok)throw new Error(`创建会话失败 HTTP ${r.status}`);conversationId=(await r.json()).conversation_id;}
async function boot(){setReady(false);const h=await fetch('/api/v1/health').then(r=>r.json());document.getElementById('health').textContent=`LLM：${h.ollama_available?'Ollama':'Mock fallback'} · 向量：${h.vector_backend}`;await openConversation();setReady(true);}
async function uploadImages(images){
  const uploaded=[];
  for(const image of images){
    const r=await fetch('/api/v1/uploads/images',{method:'POST',headers:{'Content-Type':image.file.type,'X-Filename':encodeURIComponent(image.file.name)},body:image.file});
    if(!r.ok)throw new Error(`${image.file.name} 上传失败 HTTP ${r.status}`);
    uploaded.push(await r.json());
  }
  return uploaded;
}
async function requestAnswer(text,imageIds){
  const body=JSON.stringify({message_id:newMessageId(),text,image_ids:imageIds});
  let r=await fetch(`/api/v1/conversations/${conversationId}/messages/stream`,{method:'POST',headers:{'Content-Type':'application/json'},body});
  if(r.status===404){await openConversation();r=await fetch(`/api/v1/conversations/${conversationId}/messages/stream`,{method:'POST',headers:{'Content-Type':'application/json'},body});}
  return r;
}
async function ask(rawText){
  const selected=pendingImages.splice(0); renderAttachments();
  const text=rawText.trim() || (selected.length?'请分析我上传的轮胎图片':'');
  if(!text||!conversationId)return;
  setReady(false); input.value='';
  try{
    const uploaded=await uploadImages(selected);
    selected.forEach(image=>URL.revokeObjectURL(image.preview));
    add(text,'user',uploaded.length?'图片已上传，等待视觉能力接入': '',uploaded);
    const bot=add('正在处理…','bot'); let answer=''; const citations=[];
    const r=await requestAnswer(text,uploaded.map(x=>x.image_id)); if(!r.ok)throw new Error(`请求失败 HTTP ${r.status}`);
    const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='';
    while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const blocks=buffer.split('\n\n');buffer=blocks.pop();for(const block of blocks){let event='',data='';for(const line of block.split('\n')){if(line.startsWith('event:'))event=line.slice(6).trim();if(line.startsWith('data:'))data+=line.slice(5).trim();}if(!data)continue;const payload=JSON.parse(data);if(event==='answer.delta'){answer+=payload.text;bot.content.textContent=answer;}if(event==='citation')citations.push(payload);if(event==='answer.completed'){const meta=document.createElement('div');meta.className='meta';meta.textContent=`intent=${payload.intent} · trace=${payload.trace_id}${uploaded.length?' · vision=pending':''}`;bot.el.appendChild(meta);if(citations.length){const c=document.createElement('div');c.className='citations';c.textContent='来源：'+citations.map(x=>x.title).join('；');bot.el.appendChild(c);}}}messages.scrollTop=messages.scrollHeight;}
  }catch(error){add(`请求失败：${error.message}`,'bot');}finally{setReady(true);input.focus();}
}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();ask(input.value);});
quickButtons.forEach(b=>b.addEventListener('click',()=>ask(b.dataset.q)));
boot().catch(error=>{document.getElementById('health').textContent=`初始化失败：${error.message}`;setReady(false);});
</script>
</body>
</html>
