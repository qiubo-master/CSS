<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>轮胎智能客服 Demo</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #17202a; }
    main { max-width: 820px; margin: 24px auto; background: white; border-radius: 16px; box-shadow: 0 8px 30px #0002; overflow: hidden; }
    header { padding: 18px 22px; background: #163a5f; color: white; }
    header h1 { font-size: 20px; margin: 0 0 4px; }
    header small { opacity: .8; }
    #messages { min-height: 420px; max-height: 62vh; overflow-y: auto; padding: 20px; }
    .msg { max-width: 78%; padding: 12px 14px; border-radius: 14px; margin: 10px 0; white-space: pre-wrap; }
    .user { margin-left: auto; background: #d9ebff; }
    .bot { background: #edf0f2; }
    .meta { font-size: 12px; color: #667; margin-top: 8px; }
    .citations { font-size: 12px; margin-top: 8px; }
    form { display: flex; gap: 10px; padding: 16px; border-top: 1px solid #ddd; }
    input { flex: 1; padding: 12px; border: 1px solid #aaa; border-radius: 10px; font-size: 15px; }
    button { padding: 10px 18px; border: 0; border-radius: 10px; background: #1769aa; color: white; cursor: pointer; }
    button:disabled { opacity: .5; }
    .quick { padding: 0 16px 12px; display: flex; gap: 6px; flex-wrap: wrap; }
    .quick button { font-size: 12px; background: #50728f; }
    @media (prefers-color-scheme: dark) { body { background:#101820; color:#eef; } main { background:#17232e; } .bot {background:#263744}.user{background:#194b73}.meta{color:#bbc} }
  </style>
</head>
<body>
<main>
  <header><h1>轮胎智能客服 Demo</h1><small id="health">正在检查服务…</small></header>
  <div id="messages"><div class="msg bot">您好，我可以演示轮胎知识、车型适配、价格、活动、订单和人工转接。</div></div>
  <div class="quick">
    <button data-q="225/55R17是什么意思？">规格解释</button>
    <button data-q="我的车换一套轮胎多少钱？">车型价格</button>
    <button data-q="我的订单预约到几点？">订单查询</button>
    <button data-q="轮胎鼓包了还能上高速吗？">安全风险</button>
    <button data-q="这个订单我要退款">退款转人工</button>
  </div>
  <form id="form"><input id="input" autocomplete="off" placeholder="输入轮胎相关问题"><button id="send">发送</button></form>
</main>
<script>
let conversationId;
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const send = document.getElementById('send');
const quickButtons = [...document.querySelectorAll('[data-q]')];
function setReady(ready) {
  send.disabled = !ready;
  quickButtons.forEach(button => { button.disabled = !ready; });
}
function newMessageId() {
  if (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function') {
    return globalThis.crypto.randomUUID();
  }
  const randomPart = Math.random().toString(36).slice(2);
  return `msg_${Date.now().toString(36)}_${randomPart}`;
}
function add(text, kind, meta='', citations=[]) {
  const el = document.createElement('div'); el.className = `msg ${kind}`; el.textContent = text;
  if (citations.length) { const c=document.createElement('div'); c.className='citations'; c.textContent='来源：'+citations.map(x=>x.title).join('；'); el.appendChild(c); }
  if (meta) { const m=document.createElement('div'); m.className='meta'; m.textContent=meta; el.appendChild(m); }
  messages.appendChild(el); messages.scrollTop=messages.scrollHeight; return el;
}
async function openConversation() {
  const response=await fetch('/api/v1/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:'u_001'})});
  if(!response.ok) throw new Error(`create conversation HTTP ${response.status}`);
  const conversation=await response.json();
  conversationId=conversation.conversation_id;
}
async function boot() {
  setReady(false);
  const h=await fetch('/api/v1/health').then(r=>r.json());
  document.getElementById('health').textContent=`LLM: ${h.ollama_available?'Ollama':'Mock fallback'} · 向量: ${h.vector_backend}`;
  await openConversation();
  setReady(true);
}
async function requestAnswer(text) {
  const body=JSON.stringify({message_id:newMessageId(),text});
  let response=await fetch(`/api/v1/conversations/${conversationId}/messages/stream`,{method:'POST',headers:{'Content-Type':'application/json'},body});
  if(response.status===404) {
    await openConversation();
    response=await fetch(`/api/v1/conversations/${conversationId}/messages/stream`,{method:'POST',headers:{'Content-Type':'application/json'},body});
  }
  return response;
}
async function ask(text) {
  if(!text.trim()||!conversationId)return; add(text,'user'); send.disabled=true; input.value='';
  const bot=add('','bot','正在连接…'); let answer=''; const citations=[];
  try {
    const r=await requestAnswer(text);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const reader=r.body.getReader(), decoder=new TextDecoder(); let buffer='';
    while(true) {
      const {value,done}=await reader.read(); if(done) break; buffer+=decoder.decode(value,{stream:true});
      const blocks=buffer.split('\n\n'); buffer=blocks.pop();
      for(const block of blocks) {
        let event='', data='';
        for(const line of block.split('\n')) { if(line.startsWith('event:')) event=line.slice(6).trim(); if(line.startsWith('data:')) data+=line.slice(5).trim(); }
        if(!data) continue; const payload=JSON.parse(data);
        if(event==='tool.status') bot.dataset.status=payload.message;
        if(event==='answer.delta') { answer+=payload.text; bot.firstChild ? bot.firstChild.textContent=answer : bot.textContent=answer; messages.scrollTop=messages.scrollHeight; }
        if(event==='citation') citations.push(payload);
        if(event==='answer.completed') {
          const m=document.createElement('div'); m.className='meta'; m.textContent=`intent=${payload.intent} · trace=${payload.trace_id} · ${JSON.stringify(payload.timings_ms)}`; bot.appendChild(m);
          if(citations.length) { const c=document.createElement('div'); c.className='citations'; c.textContent='来源：'+citations.map(x=>x.title).join('；'); bot.appendChild(c); }
        }
      }
    }
  } catch(e) { bot.textContent='请求失败：'+e; } finally { send.disabled=false; input.focus(); }
}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();ask(input.value)});
quickButtons.forEach(b=>b.addEventListener('click',()=>ask(b.dataset.q)));
boot().catch(error => {
  document.getElementById('health').textContent=`初始化失败：${error}`;
  setReady(false);
});
</script>
</body>
</html>
